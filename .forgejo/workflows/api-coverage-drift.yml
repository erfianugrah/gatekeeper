name: API coverage drift

# Scheduled upstream-schema drift detection. The hermetic test (test/api-coverage.test.ts)
# runs in `bun run test` and only checks the committed baseline; THIS job reaches the network,
# fetches the live Supabase + Cloudflare specs, and fails (opening a tracking issue) when an
# upstream adds/moves/removes an endpoint the proxy doesn't yet handle. See
# scripts/api-coverage/README.md.
#
# The tracking issue is opened/commented on failure and closed again on the first clean run,
# so an open issue always means "drift is live right now" rather than "drift happened once".
# The issue lives on Forgejo (this repo), opened with the per-run github.token via the API -
# the runner image has no gh CLI, so the earlier GitHub-issue version exited 127 and never
# filed anything (2026-10-19).

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

concurrency:
  group: api-coverage-drift
  cancel-in-progress: false

env:
  # Single source of truth: the open/comment step and the close step must agree on this exact
  # string, since the issue is looked up by title.
  DRIFT_ISSUE_TITLE: API coverage drift detected

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install -o /tmp/bun.sh
          bash /tmp/bun.sh "bun-v1.3.14"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - run: bun install --frozen-lockfile

      - name: Check API coverage drift
        id: drift
        run: |
          set +e
          bun run check:api-coverage 2>&1 | tee drift-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update drift issue
        if: steps.drift.outputs.exit_code != '0'
        env:
          FORGEJO_TOKEN: ${{ github.token }}
        run: |
          api="${{ forgejo.server_url }}/api/v1"
          repo="${{ github.repository }}"
          auth="Authorization: token $FORGEJO_TOKEN"
          run_url="${{ forgejo.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "The scheduled API-coverage drift check failed - an upstream API likely changed."
            echo
            echo "Run: $run_url"
            echo
            echo '```'
            cat drift-output.txt
            echo '```'
            echo
            echo "Fix: review the drift, run \`bun run api-coverage:write\`, and commit the snapshot diff"
            echo "(deciding per new op whether it needs a classifier rule or an allowlist entry)."
            echo "See \`scripts/api-coverage/README.md\`."
          } > drift-issue-body.md
          body_json="$(jq -Rs . drift-issue-body.md)"
          existing="$(curl -sf -H "$auth" "$api/repos/$repo/issues?state=open&type=issues&limit=50" \
            | jq -r --arg t "$DRIFT_ISSUE_TITLE" '.[] | select(.title == $t) | .number' | head -n1)"
          if [ -n "$existing" ]; then
            curl -sf -X POST -H "$auth" -H "Content-Type: application/json" \
              --data "$(jq -n --argjson b "$body_json" '{body: $b}')" \
              "$api/repos/$repo/issues/$existing/comments" > /dev/null
            echo "Commented on drift issue #$existing."
          else
            curl -sf -X POST -H "$auth" -H "Content-Type: application/json" \
              --data "$(jq -n --arg t "$DRIFT_ISSUE_TITLE" --argjson b "$body_json" '{title: $t, body: $b}')" \
              "$api/repos/$repo/issues" > /dev/null
            echo "Opened drift issue."
          fi

      - name: Close drift issue when clean
        if: steps.drift.outputs.exit_code == '0'
        env:
          FORGEJO_TOKEN: ${{ github.token }}
        run: |
          api="${{ forgejo.server_url }}/api/v1"
          repo="${{ github.repository }}"
          auth="Authorization: token $FORGEJO_TOKEN"
          existing="$(curl -sf -H "$auth" "$api/repos/$repo/issues?state=open&type=issues&limit=50" \
            | jq -r --arg t "$DRIFT_ISSUE_TITLE" '.[] | select(.title == $t) | .number' | head -n1)"
          [ -n "$existing" ] || { echo "No open drift issue to close."; exit 0; }
          run_url="${{ forgejo.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -X POST -H "$auth" -H "Content-Type: application/json" \
            --data "$(jq -n --arg b "Drift cleared - all providers covered and snapshots current as of $run_url. Closing; the next drift opens a new issue." '{body: $b}')" \
            "$api/repos/$repo/issues/$existing/comments" > /dev/null
          curl -sf -X PATCH -H "$auth" -H "Content-Type: application/json" \
            --data '{"state": "closed"}' "$api/repos/$repo/issues/$existing" > /dev/null
          echo "Closed drift issue #$existing."

      - name: Fail the run if drift detected
        if: steps.drift.outputs.exit_code != '0'
        run: |
          echo "::error::API coverage drift detected - see the tracking issue and run output above."
          exit 1
